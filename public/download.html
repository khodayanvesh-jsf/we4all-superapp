<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download WE4ALL App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%);
      color: #f8fafc;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .logo {
      width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #fff;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #cbd5e1; margin-bottom: 18px; }
    .badge {
      display: inline-block; background: rgba(99, 102, 241, 0.22);
      border: 1px solid rgba(129, 140, 248, 0.4); color: #c7d2fe;
      font-size: 12px; font-weight: 700; padding: 5px 12px;
      border-radius: 999px; margin-bottom: 24px;
    }
    .dl-btn {
      display: block; width: 100%; padding: 16px 20px; border-radius: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff; font-size: 16px; font-weight: 800; text-decoration: none;
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.35);
    }
    .note { margin-top: 16px; font-size: 12px; line-height: 1.5; color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">W4</div>
    <h1>WE4ALL</h1>
    <p class="sub">Official Android App</p>
    <div class="badge" id="verBadge">Latest Version</div>
    <a class="dl-btn" id="dlBtn" href="/WE4ALL.apk" download="WE4ALL.apk">⬇️ Download WE4ALL App</a>
    <p class="note">Tap Download, then open <strong>WE4ALL.apk</strong> to install.</p>
  </main>
  <script>
    (async function () {
      try {
        var r = await fetch("/ota-manifest.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return;
        var m = await r.json();
        if (m && m.version) {
          document.getElementById("verBadge").textContent = "v" + m.version + " · Auto-Updates Built In";
          document.getElementById("dlBtn").setAttribute("href", "/WE4ALL.apk?v=" + encodeURIComponent(m.version));
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
