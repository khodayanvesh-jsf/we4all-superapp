name: Build Merchant APK

on:
  push:
    branches:
      - portal/merchant-app

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App (Merchant Portal)
        env:
          VITE_APP_PORTAL: merchant
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Android Config for Merchant APK
        run: |
          sed -i 's/applicationId "[^"]*"/applicationId "com.we4all.merchant"/g' android/app/build.gradle
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">WE4ALL Merchant<\/string>/g' android/app/src/main/res/values/strings.xml

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Merchant APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WE4ALL-Merchant-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk