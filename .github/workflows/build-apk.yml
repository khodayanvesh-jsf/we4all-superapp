name: Build Auto-Versioned APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Auto-Increment Version in Gradle and UI
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.1.${{ github.run_number }}\"/g" android/app/build.gradle
          echo "export const APP_VERSION = \"1.1.${{ github.run_number }}\";" > src/version.ts
      - run: npm install && npm run build
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK with Version Number
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/WE4ALL-v1.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WE4ALL-v1.1.${{ github.run_number }}-APK
          path: android/app/build/outputs/apk/debug/WE4ALL-v1.1.${{ github.run_number }}.apk
