name: WE4ALL quality checks and Android debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-apk:
    name: Test, web build and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          node node_modules/esbuild/install.js || true

      - name: Run quality check and production web build
        run: |
          npm test
          npm run build

      - name: Sync Capacitor Android and assemble Debug APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload WE4ALL Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WE4ALL-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore