name: Export WE4ALL offline source package

on:
  push:
    branches:
      - main
      - codex/we4all-offline-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Create source-only archive from tracked files
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/we4all-export"
          mkdir -p "$export_dir"
          git archive --format=tar HEAD | tar -xf - -C "$export_dir"
          rm -f "$export_dir/WE4ALL-v3.0.1-Production.apk" "$export_dir/SOURCE-COMMIT.txt"
          printf 'Repository: %s\nBranch: %s\nCommit: %s\nExported: %s\n' \
            "$GITHUB_REPOSITORY" "${GITHUB_REF_NAME}" "$(git rev-parse HEAD)" "$(date -u +%FT%TZ)" \
            > "$export_dir/SOURCE-COMMIT.txt"
          (cd "$export_dir" && zip -qr "$RUNNER_TEMP/WE4ALL-offline-source.zip" .)
          unzip -Z1 "$RUNNER_TEMP/WE4ALL-offline-source.zip" | grep -qx 'package-lock.json'
          unzip -Z1 "$RUNNER_TEMP/WE4ALL-offline-source.zip" | grep -qx 'supabase/config.toml'
          unzip -Z1 "$RUNNER_TEMP/WE4ALL-offline-source.zip" | grep -qx 'android/gradlew'
          sha256sum "$RUNNER_TEMP/WE4ALL-offline-source.zip" > "$RUNNER_TEMP/WE4ALL-offline-source.zip.sha256"

      - name: Upload source and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WE4ALL-offline-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/WE4ALL-offline-source.zip
            ${{ runner.temp }}/WE4ALL-offline-source.zip.sha256
          if-no-files-found: error
          retention-days: 30
