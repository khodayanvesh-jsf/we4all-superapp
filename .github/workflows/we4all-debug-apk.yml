name: WE4ALL quality checks and Android debug APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-apk:
    name: Test, web build and Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm install --legacy-peer-deps
          node node_modules/esbuild/install.js || true
      - run: npm run build
      - run: |
          npx cap copy android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WE4ALL-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk