name: Build WE4ALL iOS App (Capacitor)
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm install @capacitor/ios --no-save
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - name: Build unsigned iOS archive (for Xcode / TestFlight signing)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build